name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push notebook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/jupyter-gpu:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/jupyter-gpu:sha-${{ github.sha }}
          cache-from: type=gha,scope=notebook
          cache-to: type=gha,mode=max,scope=notebook

      - name: Build and push kernel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.kernel
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/jupyter-kernel-gpu:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/jupyter-kernel-gpu:sha-${{ github.sha }}
          cache-from: type=gha,scope=kernel
          cache-to: type=gha,mode=max,scope=kernel
